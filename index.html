<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Médico</title>
</head>
<body>
    <header><h1>Centro de Turnos Médicos Online</h1></header>
    <div>
        <ul>
            <li>
                <label>Nombre y apellido:</label>
                <input type="text" name="username">
            </li>
            <li>
                <label>Correo electrónico:</label>
                <input type="email" name="email" placeholder="example@gmail.com">
            </li>
            <li>
                <label>Tipo de documento:</label>
                <select name="doctype" id="doctype">
                    <option value="Documento Nacional de Identidad">Documento Nacional de Identidad</option>
                    <option value="Docunento de Nacionalidad Extranjera">Documento de Nacionalidad Extranjera</option>
                    <option value="Documento Pasaporte">Documento Pasaporte</option>
                    <option value="Documento en trámite">Documento en trámite</option>
                </select>           
            </li>
            <li>
                <label>Posee obra social:</label>
                <select name="social-work" id="social-work">
                    <option value="yes">Si</option>
                    <option value="no">No</option>
                </select>
            </li>
            <li>
                <label>Seleccione turno:</label>     
                <select id="select-shitf">
                    <option value="Consulta Oftanmólogo">Consulta Oftanmólogo</option>
                    <option value="Consulta Pediátra">Consulta Pediátra</option>
                    <option value="Consulta Opstetra">Consulta Opstetra</option>
                </select> 
            </li>
            <li>
                <label>Seleccione fecha de turno:</label>
                <input type="date" name="date">
            </li>    
        </ul>
        <button type="submit">Solicitar turno</button>
        <section id="ubication">
            <h2>Nuestra ubicación:</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3346.446257565863!2d-68.69189367987919!3d-32.99200833592921!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x967e6d37b5afd359%3A0x2062155b95601b2b!2sCONSULTORIOS%20DON%20BOSCO!5e0!3m2!1ses!2sar!4v1788013504923!5m2!1ses!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
    </div>
</body>
</html>
